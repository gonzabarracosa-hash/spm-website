<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPM Design Solutions — Website Directions</title>
<link rel="icon" type="image/png" href="assets/brand/spm-icon-256.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  /* Context note styling */
  .note { font-family: 'Inter', sans-serif; color: #2a3340; }
  .note h1 { font-family: 'Montserrat', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/blueprint.jsx"></script>
<script type="text/babel" src="directions/precision.jsx"></script>
<script type="text/babel" src="directions/terminal.jsx"></script>

<script type="text/babel">
const { useState } = React;

// Context / reasoning note shown first on the canvas
function ContextNote() {
  const wrap = { width: 760, padding: '44px 48px', background: '#fff', border: '1px solid #e2e6ec', fontFamily: "'Inter',sans-serif", color: '#3a4654' };
  const navy = '#0A1D37', orange = '#FF6A00', grey = '#6B6F76';
  const chip = { display:'inline-block', fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.06em', padding:'5px 10px', border:'1px solid #e2e6ec', marginRight:8, marginBottom:8, color:navy };
  return (
    <div style={wrap}>
      <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:12, letterSpacing:'.18em', textTransform:'uppercase', color:orange}}>// Read me first</div>
      <h1 style={{fontFamily:"'Montserrat',sans-serif", fontWeight:800, fontSize:30, color:navy, letterSpacing:'-0.02em', margin:'14px 0 6px'}}>SPM website — 3 hero directions</h1>
      <p style={{fontSize:15.5, lineHeight:1.65, margin:'10px 0 0', maxWidth:620}}>
        Same content & structure, three aesthetic skins — all on your real brand (Oxford Blue + Signal Orange,
        Montserrat / Inter, your wordmark and the isometric technical mark). Goal: <b>land B2B clients</b> for
        automation / AI, while staying credible to individual engineers. Pick a direction (or mix) and I'll build
        out the full home + inner pages.
      </p>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:18, margin:'26px 0 0'}}>
        <div>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,color:navy,fontSize:15}}>A · Blueprint Dark</div>
          <p style={{fontSize:13, lineHeight:1.55, color:grey, margin:'6px 0 0'}}>Navy engineering-drawing world. Most distinctive & technical.</p>
        </div>
        <div>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,color:navy,fontSize:15}}>B · Precision Light</div>
          <p style={{fontSize:13, lineHeight:1.55, color:grey, margin:'6px 0 0'}}>Clean, corporate, trust-first. Safest for enterprise buyers.</p>
        </div>
        <div>
          <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,color:navy,fontSize:15}}>C · AI Terminal</div>
          <p style={{fontSize:13, lineHeight:1.55, color:grey, margin:'6px 0 0'}}>Product/AI energy with a live agent run. Leans into the IA angle.</p>
        </div>
      </div>

      <div style={{margin:'26px 0 0'}}>
        <div style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:11, letterSpacing:'.12em', textTransform:'uppercase', color:grey, marginBottom:10}}>Open questions for you</div>
        <span style={chip}>Brand = SPM Design Solutions ✓</span>
        <span style={chip}>English copy ✓</span>
        <span style={chip}>Real demos? swap placeholders</span>
        <span style={chip}>Need inner pages too?</span>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="context" title="Context" subtitle="Why these, and what to decide">
        <DCArtboard id="note" label="Read me" width={760} height={470}>
          <ContextNote />
        </DCArtboard>
      </DCSection>
      <DCSection id="directions" title="Homepage — 3 directions" subtitle="Same content · brand-true · pick one or mix">
        <DCArtboard id="A" label="A · Blueprint Dark" width={1440} height={2000}>
          <BlueprintDirection />
        </DCArtboard>
        <DCArtboard id="B" label="B · Precision Light" width={1440} height={2320}>
          <PrecisionDirection />
        </DCArtboard>
        <DCArtboard id="C" label="C · AI Terminal" width={1440} height={1950}>
          <TerminalDirection />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
