<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --navy:#0A1D37; --navy-2:#0e2647; --ink-2:#3a4654;
      --grey:#6B6F76; --grey-2:#9aa3ad; --paper:#ffffff;
      --line:#e2e6ec; --orange:#FF6A00; --orange-d:#e85f00;
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:var(--orange);} a:hover{color:var(--orange-d);}
    .slide{width:1080px; height:1080px; position:relative; overflow:hidden;
      background:var(--navy); font-family:'Inter',sans-serif;}
    .wordmark{position:absolute; top:56px; left:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5);}
    .sheet-tag{position:absolute; top:56px; right:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.08em; color:rgba(255,255,255,.4);}
    .content{position:absolute; left:64px; right:64px; top:50%; transform:translateY(-52%);}
    .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:.18em;
      text-transform:uppercase; color:var(--orange); display:block; margin-bottom:28px;}
    h1{font-family:'Montserrat',sans-serif; font-weight:800; font-size:82px; line-height:1.08;
      letter-spacing:-0.02em; color:#fff; margin:0; text-wrap:balance;}
    .sub{font-family:'Inter',sans-serif; font-size:28px; line-height:1.5; color:#cdd8e6;
      max-width:760px; margin-top:36px;}
    .swipe{position:absolute; bottom:56px; right:64px; font-family:'IBM Plex Mono',monospace;
      font-size:16px; letter-spacing:.16em; text-transform:uppercase; color:var(--orange);
      display:flex; align-items:center; gap:10px;}
    .swipe svg{width:22px; height:22px;}
    .rule{position:absolute; left:64px; bottom:56px; width:120px; height:2px; background:var(--orange);}
  </style>
</helmet>
<div class="slide">
  <div class="wordmark">SPM Design Solutions</div>
  <div class="sheet-tag">01 / 08</div>
  <div class="content">
    <span class="eyebrow">Engineering · Automation</span>
    <h1>How many hours did you lose this week looking for the right drawing?</h1>
    <p class="sub">While you keep searching by hand, someone else already automated it.</p>
  </div>
  <div class="rule"></div>
  <div class="swipe">
    Swipe
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
</div>
</x-dc>
</body>
</html>
