<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{ --navy:#0A1D37; --orange:#FF6A00; }
    *{box-sizing:border-box;}
    body{margin:0;}
    .slide{width:1080px; height:1080px; position:relative; overflow:hidden;
      background:var(--navy); font-family:'Inter',sans-serif;}
    .wordmark{position:absolute; top:56px; left:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5);}
    .sheet-tag{position:absolute; top:56px; right:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.08em; color:rgba(255,255,255,.4);}
    .eyebrow{position:absolute; top:158px; left:64px; right:64px; font-family:'IBM Plex Mono',monospace;
      font-size:20px; letter-spacing:.18em; text-transform:uppercase; color:var(--orange);}
    h2{position:absolute; top:216px; left:64px; right:64px; font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:56px; line-height:1.15; letter-spacing:-0.02em; color:#fff; margin:0; text-wrap:balance;}
    .stat{position:absolute; left:0; right:0; top:530px; text-align:center; font-family:'Montserrat',sans-serif;
      font-weight:800; font-size:170px; line-height:1; color:var(--orange); letter-spacing:-0.02em;}
    .caption{position:absolute; left:64px; right:64px; bottom:100px; text-align:center; font-family:'IBM Plex Mono',monospace;
      font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.55); line-height:1.6;}
  </style>
</helmet>
<div class="slide">
  <div class="wordmark">SPM Design Solutions</div>
  <div class="sheet-tag">05 / 08</div>
  <div class="eyebrow">The market already moved</div>
  <h2>Your competitors aren't waiting. Why are you?</h2>
  <div class="stat">€2.5B</div>
  <div class="caption">EU CAD-automation market —<br>growing 8–12% per year</div>
</div>
</x-dc>
</body>
</html>
