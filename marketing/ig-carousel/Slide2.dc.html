<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    :root{
      --navy:#0A1D37; --ink-2:#3a4654; --grey:#6B6F76; --grey-2:#9aa3ad;
      --paper:#ffffff; --line:#e2e6ec; --orange:#FF6A00; --orange-d:#e85f00;
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:var(--orange);} a:hover{color:var(--orange-d);}
    .slide{width:1080px; height:1080px; position:relative; overflow:hidden;
      background:var(--paper); font-family:'Inter',sans-serif;}
    .wordmark{position:absolute; top:56px; left:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey-2);}
    .sheet-tag{position:absolute; top:56px; right:64px; font-family:'IBM Plex Mono',monospace;
      font-size:15px; letter-spacing:.08em; color:var(--grey-2);}
    .content{position:absolute; left:64px; right:64px; top:172px;}
    .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:20px; letter-spacing:.18em;
      text-transform:uppercase; color:var(--orange); display:block; margin-bottom:24px;}
    h2{font-family:'Montserrat',sans-serif; font-weight:800; font-size:60px; line-height:1.1;
      letter-spacing:-0.02em; color:var(--navy); margin:0; text-wrap:balance;}
    .sub{font-family:'Inter',sans-serif; font-size:24px; line-height:1.5; color:var(--ink-2);
      max-width:820px; margin-top:26px;}
    .files{position:absolute; left:64px; right:64px; bottom:96px; border:1px solid var(--line);
      border-radius:8px; background:var(--paper); box-shadow:0 24px 60px -30px rgba(10,29,55,.2);}
    .file-row{display:flex; align-items:center; gap:18px; padding:26px 30px; border-top:1px solid var(--line);}
    .file-row:first-child{border-top:none;}
    .x-badge{flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:rgba(255,106,0,.1);
      display:grid; place-items:center;}
    .x-badge svg{width:18px; height:18px; stroke:var(--orange);}
    .file-name{font-family:'IBM Plex Mono',monospace; font-size:22px; color:var(--ink-2);}
  </style>
</helmet>
<div class="slide">
  <div class="wordmark">SPM Design Solutions</div>
  <div class="sheet-tag">02 / 08</div>
  <div class="content">
    <span class="eyebrow">The problem</span>
    <h2>The classic "Rev2_final_v3" problem.</h2>
    <p class="sub">Hundreds of drawings scattered across shared folders and email threads. No one knows which revision is current.</p>
  </div>
  <div class="files">
    <div class="file-row">
      <div class="x-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="file-name">Rev2_final_v3.dwg</div>
    </div>
    <div class="file-row">
      <div class="x-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="file-name">Rev_FINAL_ok.dwg</div>
    </div>
    <div class="file-row">
      <div class="x-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="file-name">Rev2_final_v3 (1).dwg</div>
    </div>
    <div class="file-row">
      <div class="x-badge"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
      <div class="file-name">Plano_bueno_este_si.dwg</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
